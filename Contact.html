<!DOCTYPE html>
<html>
<head>
    <title>Contact Us | My Shop</title>
    <style>
        body {
            background-image: url('2Added pages.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-color: rgba(255, 255, 255, 0.15);
            background-blend-mode: overlay;
            min-height: 100vh;
        }
        
        /* Content wrapper for better readability */
        .content-wrapper {
            background-color: rgba(255, 255, 255, 0.75);
            margin: 20px;
            padding: 20px;
            border-radius: 10px;
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
            backdrop-filter: blur(1px);
        }
        
        /* Header styling */
        header {
            background-color: rgba(255, 255, 255, 0.8);
            padding: 20px;
            text-align: center;
            border-bottom: 3px solid #4CAF50;
            margin-bottom: 20px;
        }
        
        header h1 {
            color: #2c3e50;
            margin-bottom: 10px;
        }
        
        /* Navigation styling */
        nav {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 15px;
        }
        
        nav a {
            text-decoration: none;
            color: #4CAF50;
            padding: 8px 15px;
            border-radius: 5px;
            transition: background-color 0.3s;
            font-weight: bold;
        }
        
        nav a:hover {
            background-color: rgba(232, 245, 233, 0.6);
        }
        
        /* Contact form styling */
        .contact-form {
            background: linear-gradient(135deg, rgba(248, 249, 250, 0.7), rgba(233, 245, 233, 0.7));
            padding: 30px;
            border-radius: 10px;
            margin: 25px 0;
            border: 2px solid #e0e0e0;
        }
        
        .contact-form form {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 600px;
            margin: 0 auto;
        }
        
        .contact-form input,
        .contact-form select,
        .contact-form textarea {
            background-color: rgba(255, 255, 255, 0.85);
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
            font-family: inherit;
        }
        
        .contact-form textarea {
            min-height: 120px;
            resize: vertical;
        }
        
        .contact-form button {
            background-color: #4CAF50;
            color: white;
            padding: 14px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s;
            font-weight: bold;
        }
        
        .contact-form button:hover {
            background-color: #45a049;
        }
        
        /* Location section styling */
        .location {
            background-color: rgba(255, 255, 255, 0.8);
            padding: 25px;
            border-radius: 10px;
            margin: 25px 0;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        .location iframe {
            width: 100%;
            height: 400px;
            border-radius: 8px;
            margin-top: 15px;
            border: 2px solid #ddd;
        }
        
        /* Footer styling */
        footer {
            background-color: rgba(255, 255, 255, 0.8);
            padding: 20px;
            text-align: center;
            margin-top: 30px;
            border-top: 2px solid #e0e0e0;
        }
        
        footer p {
            color: #666;
            margin: 0;
        }
        
        /* Mobile optimization */
        @media (max-width: 768px) {
            body {
                background-attachment: scroll;
            }
            
            .content-wrapper {
                margin: 10px;
                padding: 15px;
                background-color: rgba(255, 255, 255, 0.8);
            }
            
            .contact-form,
            .location {
                padding: 15px;
            }
            
            .location iframe {
                height: 300px;
            }
            
            nav {
                flex-direction: column;
                align-items: center;
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Contact Us</h1>
        <nav>
    <a href="index.html">Home</a>
    <a href="Products.html">Products</a>
    <a href="Support.html">Support</a>
    <a href="Near-Bcc.html">Near-Bcc</a>
    <a href="Town-Branch.html">Town-Branch</a>
    <a href="Contact.html">Contact</a>
</nav>
    </header>

    <section class="contact-form">
        <h2>Send a Message</h2>
        <form id="supportForm" action="https://formspree.io/f/mvgaeyel" method="POST" 
      onsubmit="return validateForm()">
  <input type="text" name="name" id="name" placeholder="Your Name" required />
  <input type="email" name="email" id="email" placeholder="Email" required />
  <select name="issue" id="issue" required>
    <option value="">Select an issue</option>
    <option value="order">Order Issue</option>
    <option value="product">Product Question</option>
    <option value="other">Other</option>
  </select>
  <textarea name="description" id="description" placeholder="Describe your issue..." required></textarea>
  <button type="submit">Submit Request</button>
</form>

<div id="responseMessage"></div>
    </section>

    <section class="location">
        <h2>Our Location</h2>
        <p>Type this on google maps -33.015902, 27.863458

        </p>
        <iframe src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d723.9261686109908!2d27.863227992832385!3d-33.01536796375243!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2sza!4v1748590982119!5m2!1sen!2sza" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
    </section>

    <footer>
        <p>&copy; 2025 Green Herb</p>
    </footer>
        <script>
        function validateForm() {
            // Get form fields
            const name = document.getElementById('name')?.value;
            const email = document.getElementById('email')?.value;
            const description = document.getElementById('description')?.value;
            const issue = document.getElementById('issue')?.value;
            
            // Name validation
            if (!name || name.trim() === '') {
                alert('Please enter your name');
                return false;
            }
            
            // Email validation
            if (!email || email.trim() === '') {
                alert('Please enter your email');
                return false;
            }
            
            // Email format validation
            const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailPattern.test(email)) {
                alert('Please enter a valid email address');
                return false;
            }
            
            // Issue selection validation
            if (!issue || issue === '') {
                alert('Please select an issue type');
                return false;
            }
            
            // Description validation
            if (!description || description.trim() === '') {
                alert('Please describe your issue');
                return false;
            }
            
            // Optional: Sanitize inputs before submission
            const sanitizedName = sanitizeInput(name);
            const sanitizedEmail = sanitizeInput(email);
            const sanitizedDescription = sanitizeInput(description);
            
            // You could store sanitized values in data attributes if needed
            document.getElementById('name').setAttribute('data-sanitized', sanitizedName);
            
            return true; // Allow form submission
        }
        
        // Helper function to sanitize input
        function sanitizeInput(input) {
            if (!input) return '';
            const div = document.createElement('div');
            div.textContent = input;
            return div.innerHTML;
        }
        
        // Optional: Add real-time validation feedback
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('contactForm');
            if (form) {
                form.addEventListener('submit', function(e) {
                    if (!validateForm()) {
                        e.preventDefault();
                    }
                });
            }
        });
    </script>
</body>
</html>
