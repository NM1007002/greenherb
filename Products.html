<!DOCTYPE html>
<html>
<head>
    <title>Products | My Shop</title>
    <style>
        body {
            background-image: url('2Added pages.jpg'), linear-gradient(to bottom, #f9f9f9, #e8f5e9);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-color: #f5f5f5;
            background-blend-mode: overlay;
            min-height: 100vh;
        }
        
        /* Make content readable on background */
        header, section, footer {
            background-color: rgba(255, 255, 255, 0.9);
            padding: 20px;
            margin: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        
        /* Mobile optimization */
        @media (max-width: 768px) {
            body {
                background-attachment: scroll;
            }
            header, section, footer {
                margin: 10px;
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Our Products</h1>
        <nav>
            <a href="Index.html">Home</a>
            <a href="Products.html">Products</a>
            <a href="Contact.html">Contact</a>
            <a href="Near-Bcc.html">Near-Bcc</a>
            <a href="Town-Branch.html">Town-Branch</a>
            <a href="Support.html">Support</a>
        </nav>
    </header>

    <section class="product-list">
        <div class="product">
            <img src="Screenshot (9).png" alt="Product 1">
            <h3>Product 1</h3>
            <p>$5.00</p>
            
        </div>
        <div class="product">
            <img src="Screenshot (8).png" alt="Product 2">
            <h3>Product 2</h3>
            <p>R4.00</p>
            
        </div>
        <!-- Repeat for more products -->
    </section>

    <footer>
        <p>&copy; 2025 Green Herb</p>
    </footer>
</body>
</html>
