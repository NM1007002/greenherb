<!DOCTYPE html>
<html>
<head>
    <title>Products | Green Herb</title>
    <style>
        body {
            background-image: url('2Added pages.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-color: rgba(255, 255, 255, 0.15);
            background-blend-mode: overlay;
            min-height: 100vh;
        }
        
        /* Content wrapper */
        .content-wrapper {
            background-color: rgba(255, 255, 255, 0.75);
            margin: 20px;
            padding: 20px;
            border-radius: 10px;
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
            backdrop-filter: blur(1px);
        }
        
        /* Header styling */
        header {
            background-color: rgba(255, 255, 255, 0.8);
            padding: 20px;
            text-align: center;
            border-bottom: 3px solid #4CAF50;
            margin-bottom: 20px;
            border-radius: 10px;
        }
        
        header h1 {
            color: #2c3e50;
            margin-bottom: 10px;
        }
        
        /* Navigation styling */
        nav {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 15px;
        }
        
        nav a {
            text-decoration: none;
            color: #4CAF50;
            padding: 8px 15px;
            border-radius: 5px;
            transition: background-color 0.3s;
            font-weight: bold;
        }
        
        nav a:hover {
            background-color: rgba(232, 245, 233, 0.6);
        }
        
        /* Product list styling */
        .product-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 25px;
            margin: 30px 0;
        }
        
        .product {
            background-color: rgba(255, 255, 255, 0.9);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            border: 2px solid #e0e0e0;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        
        .product:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
        }
        
        .product img {
            width: 100%;
            max-width: 200px;
            height: 200px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 15px;
            border: 2px solid #ddd;
        }
        
        .product h3 {
            color: #2c3e50;
            margin: 10px 0 5px 0;
            font-size: 1.2em;
        }
        
        .product p {
            color: #4CAF50;
            font-weight: bold;
            font-size: 1.1em;
            margin: 5px 0;
        }
        
        /* Footer styling */
        footer {
            background-color: rgba(255, 255, 255, 0.8);
            padding: 20px;
            text-align: center;
            margin-top: 30px;
            border-top: 2px solid #e0e0e0;
        }
        
        footer p {
            color: #666;
            margin: 0;
        }
        
        /* Mobile optimization */
        @media (max-width: 768px) {
            body {
                background-attachment: scroll;
            }
            
            .content-wrapper {
                margin: 10px;
                padding: 15px;
                background-color: rgba(255, 255, 255, 0.8);
            }
            
            .product-list {
                grid-template-columns: 1fr;
                gap: 20px;
            }
            
            nav {
                flex-direction: column;
                align-items: center;
                gap: 10px;
            }
        }
        
        @media (min-width: 769px) and (max-width: 1024px) {
            .product-list {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="content-wrapper">
        <header>
            <h1>Our Products</h1>
            <nav>
                <a href="index.html">Home</a>
                <a href="Products.html">Products</a>
                <a href="Support.html">Support</a>
                <a href="Near-Bcc.html">Near BCC</a>
                <a href="Town-Branch.html">Town Branch</a>
                <a href="Contact.html">Contact</a>
            </nav>
        </header>

        <section class="product-list">
            <div class="product">
                <img src="Screenshot (9).png" alt="Product 1">
                <h3>Product 1</h3>
                <p>R5.00</p>
            </div>
            <div class="product">
                <img src="Screenshot (8).png" alt="Product 2">
                <h3>Product 2</h3>
                <p>R4.00</p>
            </div>
            <!-- Add more products here as needed -->
        </section>

        <footer>
            <p>&copy; 2025 Green Herb</p>
        </footer>
    </div>
</body>
</html>
